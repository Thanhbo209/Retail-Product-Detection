project:
  name: retail_product_detection_dataset
  task: object_detection
  annotation_format: yolo
  description: Retail product detection dataset for supermarket shelf and consumer product images.

paths:
  raw_data: data/raw
  processed_data: data/processed
  yolo_dataset: data/yolo
  reports: outputs/reports
  visualizations: outputs/visualizations

dataset:
  image_extensions:
    - .jpg
    - .jpeg
    - .png
    - .bmp
    - .webp
  splits:
    train: data/yolo/images/train
    val: data/yolo/images/val
    test: data/yolo/images/test
  labels:
    train: data/yolo/labels/train
    val: data/yolo/labels/val
    test: data/yolo/labels/test

classes:
  - milk
  - water_bottle
  - snack
  - coffee
  - tea
  - juice
  - instant_noodle
  - canned_food
  - box_product
  - other_product

validation:
  warn_empty_labels: true
  min_box_width: 0.0
  min_box_height: 0.0
  report_dir: outputs/reports

training_defaults:
  model: yolov8n.pt
  epochs: 50
  image_size: 640
  batch_size: 16

